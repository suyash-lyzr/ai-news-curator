name: web-search
description: Search the web for latest AI news articles and blog posts
input_schema:
  type: object
  properties:
    query:
      type: string
      description: Search query for AI news (e.g., "latest AI news today")
    num_results:
      type: integer
      description: Number of results to return (default 10)
      default: 10
  required:
    - query
